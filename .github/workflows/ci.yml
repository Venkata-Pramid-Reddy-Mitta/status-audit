name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no evidence extra, so a missing browser cannot mask a broken import)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools experiments

      - name: Tests with coverage (its own step, so a red test is not buried in a script)
        run: |
          mkdir -p reports
          python -m pytest --junitxml=reports/junit.xml \
            --cov=status_audit --cov-report=xml:reports/coverage.xml \
            --cov-report=json:reports/coverage.json -q

      - name: Enforce the coverage floor
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("reports/coverage.xml").getroot().get("line-rate"))
          pct = rate * 100
          floor = 95.0
          print(f"line coverage {pct:.1f}% (floor {floor})")
          raise SystemExit(0 if pct >= floor else 1)
          PY

      - name: Re-measure every figure and fail on a stale one
        run: |
          python tools/collect_metrics.py --skip-tests
          python tools/check_numbers.py

      - name: Re-run the experiments from scratch
        run: |
          for e in headline confession_lag threshold_sensitivity rollup_rule direction_split; do
            python experiments/exp_$e.py
          done

      - name: Publish the uncomfortable table to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("docs/metrics.json"))["metrics"]
          print("### status-audit: the numbers this build re-measured\n")
          print("| metric | value |")
          print("|---|---|")
          print(f"| program-weeks Green over trouble | {m['green_over_trouble']} |")
          print(f"| of those, Green over Red | {m['green_over_red']} |")
          print(f"| headline robust floor | {m['headline_robust_floor']} |")
          print(f"| headline if amber line tightened | {m['headline_inflated']} |")
          print(f"| rollup violations (strict / lenient) | {m['rollup_violations_worst_of']} / {m['rollup_violations_majority']} |")
          print(f"| longest confession lag (weeks) | {m['max_confession_lag']} |")
          print(f"| tests / coverage | {m['tests_total']} / {m['coverage_line_pct']}% |")
          PY

      - name: Upload experiment JSON and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}
          path: |
            docs/metrics.json
            docs/experiments/*.json
